<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Poster · Today</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  /* C. Poster: full-bleed flat colour per block, giant type, almost no chrome. Closest to the Morse trainer. */
  :root { --ink: #121212; --paper: #F5F1E6; --c1: #1F6F78; --c2: #D9482B; --c3: #E9B93D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; }
  .stack { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr 1fr 1fr 96px; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 14px; font-weight: 500; letter-spacing: .01em; }
  .bar span { opacity: .7; }
  .bar b { font-weight: 700; }
  .blk { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 22px 28px 24px; color: var(--paper); overflow: hidden; }
  .blk.c1 { background: var(--c1); } .blk.c2 { background: var(--c2); } .blk.c3 { background: var(--c3); color: var(--ink); }
  .blk .k { font-size: 14px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; opacity: .8; }
  .blk .n { font-size: 40px; font-weight: 700; line-height: .95; letter-spacing: -.03em; margin-top: 8px; max-width: 12ch; }
  .blk .d { margin-top: 10px; font-size: 16px; opacity: .85; max-width: 40ch; }
  .blk .m { font-size: 128px; font-weight: 700; line-height: .8; letter-spacing: -.06em; }
  .blk .m small { font-size: 18px; letter-spacing: 0; font-weight: 500; margin-left: 6px; }
  .go { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: var(--paper); color: var(--ink); font-size: 34px; font-weight: 700; letter-spacing: -.03em; cursor: pointer; border: 0; font-family: inherit; text-align: left; }
  .go span { font-size: 15px; font-weight: 500; letter-spacing: 0; opacity: .6; }
  .week { display: flex; gap: 6px; }
  .week i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; opacity: .35; }
  .week i.on { background: currentColor; opacity: 1; }
  .week i.today { opacity: 1; }
</style>
</head>
<body>
<div class="stack">
  <div class="bar"><b>Kata</b><span>Friday 18 · week 3</span><div class="week"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="today"></i><i></i><i></i></div></div>
  <section class="blk c1"><div><div class="k">Warm-up</div><div class="n">Ghosted lines. Tables of ellipses.</div></div><div class="m">10<small>min</small></div></section>
  <section class="blk c2"><div><div class="k">Homework · The Next Fifty</div><div class="n">Boxes with line extensions</div><div class="d">62 of 250. No vanishing points on the page, shallow foreshortening.</div></div><div class="m">20<small>min</small></div></section>
  <section class="blk c3"><div><div class="k">Free drawing</div><div class="n">Whatever you like.</div></div><div class="m">30<small>min</small></div></section>
  <button class="go">Start <span>on paper · change</span></button>
</div>
</body>
</html>
