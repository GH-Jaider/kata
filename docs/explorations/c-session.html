<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Poster · Session</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #121212; --paper: #F5F1E6; --c2: #D9482B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--c2); color: var(--paper); font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; }
  .poster { min-height: 100vh; display: flex; flex-direction: column; padding: 22px 28px 26px; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
  .top .segs { display: flex; gap: 6px; }
  .top .segs i { height: 6px; width: 28px; background: rgba(255,255,255,.35); border-radius: 3px; }
  .top .segs i.done { background: rgba(255,255,255,.7); } .top .segs i.on { background: var(--paper); width: 56px; } .top .segs i.long { width: 72px; }
  h1 { font-size: 52px; font-weight: 700; line-height: .95; letter-spacing: -.035em; margin: 26px 0 0; max-width: 11ch; }
  .d { margin: 12px 0 0; opacity: .85; max-width: 40ch; }
  .d a { color: inherit; font-weight: 700; }
  .mid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 24px; margin-top: 10px; }
  .fig svg { width: 100%; max-width: 300px; height: auto; color: var(--paper); }
  .fig svg * { vector-effect: non-scaling-stroke; }
  .t { font-size: 150px; font-weight: 700; line-height: .85; letter-spacing: -.07em; text-align: right; }
  .t small { display: block; font-size: 16px; letter-spacing: 0; font-weight: 500; opacity: .8; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .cnt { display: flex; align-items: center; gap: 12px; }
  .cnt .n { font-size: 64px; font-weight: 700; line-height: .9; letter-spacing: -.05em; min-width: 60px; }
  .cnt button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--paper); background: transparent; color: var(--paper); font: inherit; font-size: 24px; cursor: pointer; }
  .cnt .k { font-size: 15px; opacity: .85; margin-left: 6px; }
  .acts { display: flex; gap: 22px; align-items: baseline; }
  .acts a { color: inherit; font-weight: 700; font-size: 20px; text-decoration: none; }
  .acts a.dim { font-weight: 500; opacity: .7; font-size: 15px; }
  .next { background: var(--paper); color: var(--ink); border: 0; font: inherit; font-weight: 700; font-size: 22px; letter-spacing: -.02em; padding: 14px 24px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="poster">
  <div class="top"><span>Homework · 20 min</span><div class="segs"><i class="done"></i><i class="done"></i><i class="on"></i><i class="long"></i></div><span>3 of 4</span></div>
  <h1>Boxes with line extensions</h1>
  <p class="d">The Next Fifty. No vanishing points on the page, shallow foreshortening, five or six per page. Extend the lines before the next page. <a href="#">Steps</a></p>
  <div class="mid">
    <figure class="fig" style="margin:0"><x-fig name="boxes"></x-fig></figure>
    <div class="t">18:24<small>left · 67 of 250 after this</small></div>
  </div>
  <div class="row">
    <div class="cnt"><button>−</button><span class="n">5</span><button>+</button><span class="k">boxes<br>this block</span></div>
    <div class="acts"><a href="#">Photo</a><a class="dim" href="#">Pause</a><a class="dim" href="#">End</a><button class="next">Next →</button></div>
  </div>
</div>
<script src="../mockups/mock.js"></script>
</body>
</html>
